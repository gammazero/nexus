name: pattern-based-prefix-registration
spec_section: "Advanced §14.3.7 — Pattern-based Registration"
realm: realm1
serializer: json

# Callee registers with match=prefix; caller invokes a child URI;
# dealer routes to the prefix registration and includes the actual
# procedure URI in INVOCATION.details.procedure (a router obligation
# under non-exact matching, see dealer.go around line 951).
peers:
  - name: callee
  - name: caller

steps:
  - peer: callee
    send: [1, "realm1", {roles: {callee: {features: {pattern_based_registration: true}}}}]
  - peer: callee
    expect: [2, "{{$callee_session:int}}", "_"]

  - peer: callee
    send: [64, 19001, {match: "prefix"}, "spec.test.proc."]
    note: "REGISTER with match=prefix"
  - peer: callee
    expect: [65, 19001, "{{$reg_id:int}}"]

  - peer: caller
    send: [1, "realm1", {roles: {caller: {}}}]
  - peer: caller
    expect: [2, "{{$caller_session:int}}", "_"]

  - peer: caller
    send: [48, 19002, {}, "spec.test.proc.alarm", ["x"]]
  - peer: callee
    expect: [68, "{{$inv_id:int}}", "{{$reg_id:int}}", {procedure: "spec.test.proc.alarm"}, ["x"]]
    note: "INVOCATION carries the actual procedure URI"

  - peer: callee
    send: [70, "{{$inv_id:int}}", {}, ["ok"]]
  - peer: caller
    expect: [50, 19002, "_", ["ok"]]
