name: cancel-mode-skip-replies-immediately-no-interrupt
spec_section: "Advanced §14.3.4 — Call Canceling, mode=skip"
realm: realm1
serializer: json

# In `skip` mode, the dealer replies to the caller with ERROR(canceled)
# immediately and does NOT send INTERRUPT to the callee. Any later
# YIELD/ERROR from the callee is discarded by the dealer.
peers:
  - name: callee
  - name: caller

steps:
  - peer: callee
    send: [1, "realm1", {roles: {callee: {features: {call_canceling: true}}}}]
  - peer: callee
    expect: [2, "{{$callee_session:int}}", "_"]

  - peer: callee
    send: [64, 15001, {}, "spec.test.cancel.skip"]
  - peer: callee
    expect: [65, 15001, "{{$reg_id:int}}"]

  - peer: caller
    send: [1, "realm1", {roles: {caller: {features: {call_canceling: true}}}}]
  - peer: caller
    expect: [2, "{{$caller_session:int}}", "_"]

  # CALL — callee receives INVOCATION, holds it.
  - peer: caller
    send: [48, 15002, {}, "spec.test.cancel.skip", []]
  - peer: callee
    expect: [68, "{{$inv_id:int}}", "{{$reg_id:int}}", "_"]

  # CANCEL with mode=skip.
  - peer: caller
    send: [49, 15002, {mode: "skip"}]

  # Caller gets ERROR(canceled). Dealer did not send INTERRUPT to the
  # callee — the runner does not assert silence here, but plan 016
  # (kill) and 017 (killnowait) confirm the inverse case (INTERRUPT
  # IS delivered) so the contrast pins the skip semantics.
  - peer: caller
    expect: [8, 48, 15002, "_", "wamp.error.canceled"]
