name: Docker

on:
  push:
    paths:
      - .github/workflows/docker-publish.yml
      - 'test/**'
      - 'client/**'
      - 'nexusd/**'
      - 'router/**'
      - 'stdlog/**'
      - 'transport/**'
      - 'wamp/**'
      - 'Dockerfile'
      - '.dockerignore'
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.sha }}
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: (github.repository == 'gammazero/nexus')
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          build-args: BUILD_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexusd:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nexusd:${{ env.TAG }}
